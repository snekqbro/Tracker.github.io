/* v6 fixes: compact habit matrix, editable minute slots, persistent editors */
.habit-table-wrap{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.habit-table{min-width:780px;width:100%;table-layout:fixed;font-size:10px}
.habit-table th,.habit-table td{padding:3px 1px;min-width:0}
.habit-table th:first-child,.habit-table td:first-child{width:150px;min-width:150px;max-width:150px;padding-left:9px;padding-right:6px}
.habit-table .day-col{width:19px;min-width:19px;max-width:19px}
.habit-table .week-total{width:38px;min-width:38px;max-width:38px;font-size:9px}
.habit-cell{width:20px;height:26px;max-width:20px;padding:0;border-radius:6px;font-size:11px}
.habit-sub-name{padding-left:12px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-main-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.habit-table tr.main td:not(:first-child){background:var(--card2);}
.habit-table tr.main td:not(:first-child) .habit-cell{display:none}
.schedule{gap:9px}
.slot{grid-template-columns:74px minmax(0,1fr) 28px;gap:10px}
.slot-time{width:100%;padding:10px 8px!important;font-variant-numeric:tabular-nums;text-align:center}
.slot-delete{width:28px;height:28px;min-width:28px;padding:0;border-radius:9px}
.schedule-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.schedule-add-time{width:130px}
.weekly-focus-card{margin-top:16px}
.weekly-focus-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 8px}
@media(max-width:720px){.habit-table{min-width:760px}.habit-table th:first-child,.habit-table td:first-child{width:132px;min-width:132px;max-width:132px}.habit-table .day-col{width:18px;min-width:18px;max-width:18px}.habit-table .week-total{width:34px;min-width:34px;max-width:34px}.habit-cell{width:19px;max-width:19px;height:25px;font-size:10px}.slot{grid-template-columns:68px minmax(0,1fr) 28px}.weekly-focus-metrics{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.habit-table{min-width:742px}.habit-table th:first-child,.habit-table td:first-child{width:120px;min-width:120px;max-width:120px}.habit-table .day-col{width:17px;min-width:17px;max-width:17px}.habit-table .week-total{width:32px;min-width:32px;max-width:32px}.habit-cell{width:18px;max-width:18px;height:24px}.slot{grid-template-columns:64px minmax(0,1fr) 28px}.schedule-add-time{width:120px}}

$('#yearNext').onclick=()=>{const maxM=new Date().getMonth();if(yearViewMonth<maxM){yearViewMonth++;steps.viewMonth=yearViewMonth;write(KEYS.steps,steps);renderYearActivity();}};

let habits=read(KEYS.habits,{items:[],marks:{}});if(!habits||!Array.isArray(habits.items)||typeof habits.marks!=='object')habits={items:[],marks:{}};
function habitMonth(){const d=new Date();return {y:d.getFullYear(),m:d.getMonth(),count:daysInMonth(d.getFullYear(),d.getMonth())}}
function renderHabitParent(){const sel=$('#habitParent');const mains=habits.items.filter(h=>h.type==='main');sel.innerHTML=`<option value="">${esc(t('selectParent'))}</option>`+mains.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('');}
function orderedHabitItems(){const mains=habits.items.filter(h=>h.type==='main');const out=[];mains.forEach(main=>{out.push(main);habits.items.filter(h=>h.type==='sub'&&h.parentId===main.id).forEach(sub=>out.push(sub))});habits.items.filter(h=>h.type==='sub'&&!habits.items.some(p=>p.id===h.parentId)).forEach(sub=>out.push(sub));return out;}
function renderHabits(){renderHabitParent();const wrap=$('#habitTableWrap');if(!habits.items.length){wrap.innerHTML=`<div class="empty">${esc(t('noHabits'))}</div>`;return};const {y,m,count}=habitMonth(),mk=`${y}-${String(m+1).padStart(2,'0')}`;let head='<thead><tr><th>Habit</th>';for(let d=1;d<=count;d++){head+=`<th class="day-col">${d}</th>`;if(d%7===0||d===count)head+=`<th class="week-total">${esc(t('weeklyTotal'))}</th>`}head+='</tr></thead>';let body='<tbody>';orderedHabitItems().forEach(h=>{const isMain=h.type==='main';body+=`<tr class="${isMain?'main':''}"><td>${isMain?`<span class="habit-main-name">${esc(h.name)}</span>`:`<span class="habit-sub-name">↳ ${esc(h.name)}</span>`}</td>`;let done=0,segmentStart=1;for(let d=1;d<=count;d++){const key=`${mk}:${h.id}:${d}`,st=habits.marks[key]||'';if(!isMain&&st==='y')done++;body+=`<td class="day-col">${isMain?'':`<button class="habit-cell ${st}" data-h="${h.id}" data-d="${d}">${st==='y'?'✓':st==='n'?'✗':''}</button>`}</td>`;if(d%7===0||d===count){const segment=d-segmentStart+1;body+=`<td class="week-total">${isMain?'':`${done}/${segment}`}</td>`;done=0;segmentStart=d+1}}body+='</tr>'});body+='</tbody>';wrap.innerHTML=`<table class="habit-table">${head}${body}</table>`;wrap.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const key=`${mk}:${b.dataset.h}:${b.dataset.d}`,st=habits.marks[key]||'';habits.marks[key]=st===''?'y':st==='y'?'n':'';write(KEYS.habits,habits);renderHabits();updateDashboard();})}
$('#habitType').onchange=()=>$('#parentField').style.display=$('#habitType').value==='sub'?'block':'none';$('#addHabit').onclick=()=>{const name=$('#habitName').value.trim(),type=$('#habitType').value,parent=$('#habitParent').value;if(!name)return;if(type==='sub'&&!parent){toast(t('selectParent'));return}habits.items.push({id:uid(),name,type,parentId:type==='sub'?parent:null});write(KEYS.habits,habits);$('#habitName').value='';renderHabits();updateDashboard();toast(t('addHabit'));};$('#clearHabits').onclick=()=>{if(confirm(t('confirmClear'))){habits={items:[],marks:{}};write(KEYS.habits,habits);renderHabits();updateDashboard();}};
function habitStats(){const {y,m,count}=habitMonth(),mk=`${y}-${String(m+1).padStart(2,'0')}`;let done=0,marked=0;habits.items.filter(h=>h.type==='sub').forEach(h=>{for(let d=1;d<=count;d++){const st=habits.marks[`${mk}:${h.id}:${d}`]||'';if(st==='y')done++;if(st!=='')marked++}});return {done,marked,pct:marked?Math.round(done/marked*100):0}}

let timerData=read(KEYS.timer,{sessions:[],active:null});
if(!timerData||!Array.isArray(timerData.sessions))timerData={sessions:[],active:null};
if(!Object.prototype.hasOwnProperty.call(timerData,'active'))timerData.active=null;
timerData.sessions=timerData.sessions.map(s=>({id:s.id||uid(),date:Number(s.date)||Date.now(),ms:Math.min(36000000,Math.max(0,Number(s.ms)||0))}));
let timerMs=0,timerRunning=false,timerStartedAt=0,timerSessionStartedAt=0,timerInterval=0,timerPersistInterval=0;
if(timerData.active&&Number(timerData.active.elapsed)>=0){timerMs=Math.min(36000000,Number(timerData.active.elapsed)||0);timerRunning=!!timerData.active.running;timerStartedAt=Number(timerData.active.startedAt)||0;timerSessionStartedAt=Number(timerData.active.sessionStartedAt)||timerStartedAt||0;if(timerRunning&&!timerStartedAt){timerRunning=false;timerStartedAt=0;timerData.active=null}}
write(KEYS.timer,timerData);
function persistTimerActive(){timerData.active=timerRunning?{running:true,elapsed:timerMs,startedAt:timerStartedAt,sessionStartedAt:timerSessionStartedAt}:{running:false,elapsed:timerMs,startedAt:0,sessionStartedAt:timerSessionStartedAt};write(KEYS.timer,timerData)}
function formatMs(ms){let s=Math.min(36000,Math.floor(Math.max(0,ms)/1000)),h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60),sec=s%60;return [h,m,sec].map(v=>String(v).padStart(2,'0')).join(':')}
function formatShortMs(ms){const totalMin=Math.floor(Math.max(0,ms)/60000),h=Math.floor(totalMin/60),m=totalMin%60;return h?(h+' '+t('hoursShort')+' '+m+' '+t('minutesShort')):(m+' '+t('minutesShort'))}
function effectiveMs(){return timerRunning?Math.min(36000000,timerMs+Date.now()-timerStartedAt):timerMs}
function checkpointTimer(){if(!timerRunning)return timerMs;const now=Date.now();timerMs=Math.min(36000000,timerMs+Math.max(0,now-timerStartedAt));timerStartedAt=now;persistTimerActive();return timerMs}
function renderClock(){$('#clock').textContent=formatMs(effectiveMs());$('#timerState').textContent=timerRunning?t('running'):t('ready')}
function startTimer(){if(effectiveMs()>=36000000){toast(t('limit'));return}if(timerRunning)return;const now=Date.now();timerMs=Math.min(36000000,effectiveMs());timerStartedAt=now;timerSessionStartedAt=timerSessionStartedAt||now;timerRunning=true;persistTimerActive();clearInterval(timerInterval);clearInterval(timerPersistInterval);timerInterval=setInterval(()=>{const ms=effectiveMs();if(ms>=36000000){checkpointTimer();pauseTimer();toast(t('limit'));return}renderClock();updateDashboard();renderTimer()},250);timerPersistInterval=setInterval(()=>{if(timerRunning)checkpointTimer()},1000);renderClock()}
function pauseTimer(){if(!timerRunning)return;checkpointTimer();timerRunning=false;clearInterval(timerInterval);clearInterval(timerPersistInterval);timerInterval=0;timerPersistInterval=0;persistTimerActive();renderClock();renderTimer();updateDashboard()}
function resetTimer(){pauseTimer();timerMs=0;timerStartedAt=0;timerSessionStartedAt=0;timerData.active=null;write(KEYS.timer,timerData);renderClock();renderTimer();updateDashboard()}
function mondayStart(d){const x=new Date(d),day=x.getDay()||7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day+1);return x}
function weekWindow(offset=0){const start=mondayStart(new Date());start.setDate(start.getDate()+offset*7);const end=new Date(start);end.setDate(end.getDate()+7);return {start,end}}
function sessionsInWindow(start,end){return timerData.sessions.filter(s=>{const ts=Number(s.date);return Number.isFinite(ts)&&ts>=start.getTime()&&ts<end.getTime()})}
function weeklyStats(offset=0){const {start,end}=weekWindow(offset),sessions=sessionsInWindow(start,end);return {start,end,sessions,total:sessions.reduce((a,s)=>a+Math.max(0,Number(s.ms)||0),0),best:sessions.reduce((m,s)=>Math.max(m,Number(s.ms)||0),0)}}
function renderWeeklyChart(cur){const days=[];for(let i=0;i<7;i++){const d=new Date(cur.start);d.setDate(d.getDate()+i);const key=localDateKey(d.getTime());const total=timerData.sessions.filter(s=>localDateKey(s.date)===key).reduce((a,s)=>a+Math.max(0,Number(s.ms)||0),0);days.push({d,total})}if(timerRunning){const today=todayKey();const item=days.find(x=>localDateKey(x.d.getTime())===today);if(item)item.total+=effectiveMs()}const max=Math.max(1,...days.map(x=>x.total));const labels=dayNames[lang].map(n=>n.slice(0,2));$('#focusWeekChart').innerHTML=days.map((x,i)=>`<div class="focus-day"><div class="focus-track" title="${esc(labels[i])}: ${esc(formatMs(x.total))}"><div class="focus-fill" style="height:${Math.max(3,Math.round(x.total/max*130))}px"></div></div><div class="focus-day-label">${esc(labels[i])}</div></div>`).join('');const last=new Date(cur.end);last.setDate(last.getDate()-1);$('#focusWeekStart').textContent=`${String(cur.start.getDate()).padStart(2,'0')}.${String(cur.start.getMonth()+1).padStart(2,'0')} — ${String(last.getDate()).padStart(2,'0')}.${String(last.getMonth()+1).padStart(2,'0')}`;$('#focusWeekBest').textContent=cur.best? t('bestThisWeek',{n:Math.max(1,Math.round(cur.best/60000))}):t('noSavedThisWeek');$('#weekFocusTotal').textContent=formatMs(cur.total+(timerRunning?effectiveMs():0));$('#weekFocusMax').textContent=formatMs(Math.max(cur.best,timerRunning?effectiveMs():0))}
function renderTimer(){renderClock();const cur=weeklyStats(0),past=weeklyStats(-1),curTotal=cur.total+(timerRunning?effectiveMs():0),pastTotal=past.total;$('#weekTotal').textContent=formatMs(curTotal);$('#prevWeekTotal').textContent=formatMs(pastTotal);$('#weekSessions').textContent=String(cur.sessions.length);let analysis=t('noSavedThisWeek');if(curTotal||pastTotal){const diff=curTotal-pastTotal;analysis=diff===0?t('weekEqual',{n:formatShortMs(curTotal)}):t(diff>0?'weekAhead':'weekBehind',{current:formatShortMs(curTotal),previous:formatShortMs(pastTotal),diff:formatShortMs(Math.abs(diff))})}$('#timerAnalysis').textContent=analysis;renderWeeklyChart(cur);$('#timerHistory').innerHTML=timerData.sessions.length?timerData.sessions.slice().sort((a,b)=>Number(b.date)-Number(a.date)).map(s=>`<div class="history-item"><span>${esc(fmtDateTime(s.date))}</span><b>${formatMs(s.ms)}</b></div>`).join(''):`<div class="empty">${esc(t('noSessions'))}</div>`}
$('#timerStart').onclick=startTimer;$('#timerPause').onclick=pauseTimer;$('#timerReset').onclick=resetTimer;$('#timerSave').onclick=()=>{pauseTimer();const ms=Math.min(timerMs,36000000);if(ms<1000){toast(t('nothingToSave'));return}timerData.sessions.push({id:uid(),date:timerSessionStartedAt||Date.now(),ms});timerMs=0;timerStartedAt=0;timerSessionStartedAt=0;timerData.active=null;write(KEYS.timer,timerData);renderTimer();updateDashboard();toast(t('sessionSaved'));};

let finance=read(KEYS.finance,{start:0,operations:[]});if(!finance||!Array.isArray(finance.operations))finance={start:Number(finance?.start||0),operations:[]};let calcValue='0',calcType='income';
function updateCalc(){$('#calcDisplay').textContent=Number(calcValue||0).toLocaleString(lang==='ru'?'ru-RU':'en-US')}function setCalcType(type){calcType=type;$('#incomeType').classList.toggle('active',type==='income');$('#expenseType').classList.toggle('active',type==='expense')}$$('.type-btn').forEach(b=>b.onclick=()=>setCalcType(b.dataset.type));$$('.key').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='clear')calcValue='0';else if(k==='back')calcValue=calcValue.length>1?calcValue.slice(0,-1):'0';else if(calcValue==='0')calcValue=k;else if(calcValue.length<12)calcValue+=k;updateCalc();});$('#opDate').value=todayKey();
function renderFinance(){const balance=Number(finance.start||0)+finance.operations.reduce((a,o)=>a+Number(o.amount||0),0),ym=monthKey(),monthOps=finance.operations.filter(o=>String(o.date).slice(0,7)===ym),spend=monthOps.filter(o=>Number(o.amount)<0).reduce((a,o)=>a+Math.abs(Number(o.amount)),0),income=monthOps.filter(o=>Number(o.amount)>0).reduce((a,o)=>a+Number(o.amount),0),largest=monthOps.filter(o=>Number(o.amount)<0).sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount))[0];$('#startBalanceDisplay').textContent=money(finance.start);$('#financeBalance').textContent=money(balance);$('#monthlySpend').textContent=money(spend);$('#largestPurchase').textContent=money(largest?Math.abs(largest.amount):0);$('#largestPurchaseName').textContent=largest?(largest.description||t('purchase')):t('noExpenses');$('#operationList').innerHTML=finance.operations.length?finance.operations.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(o=>`<div class="op"><div><div style="font-weight:650">${esc(o.description||t('purchase'))}</div><div class="op-date">${Number(o.amount)>=0?esc(t('incomeLabel')):esc(t('expenseLabel'))} · ${esc(o.date)}</div></div><div class="op-amt ${Number(o.amount)>=0?'positive':'negative'}">${Number(o.amount)>=0?'+':''}${money(o.amount)}</div><button class="btn icon danger" data-del-op="${o.id}">×</button></div>`).join(''):`<div class="empty">${esc(t('noOperations'))}</div>`;$('#operationList').querySelectorAll('[data-del-op]').forEach(b=>b.onclick=()=>{finance.operations=finance.operations.filter(o=>o.id!==b.dataset.delOp);write(KEYS.finance,finance);renderFinance();updateDashboard();toast(t('operationDeleted'));});const mx=Math.max(1,income,spend);$('#financeChart').innerHTML=`<div class="fin-bars"><div class="fin-col"><div class="fin-value">${money(income)}</div><div class="fin-track"><div class="fin-fill" style="height:${Math.max(4,Math.round(income/mx*130))}px"></div></div><div class="fin-label">${esc(t('income'))}</div></div><div class="fin-col"><div class="fin-value">${money(spend)}</div><div class="fin-track"><div class="fin-fill" style="height:${Math.max(4,Math.round(spend/mx*130))}px"></div></div><div class="fin-label">${esc(t('expense'))}</div></div></div>`}
$('#editStartBalance').onclick=()=>{const v=prompt(t('promptStart'),String(finance.start??0));if(v===null)return;const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)){toast(t('invalidAmount'));return}finance.start=n;write(KEYS.finance,finance);renderFinance();updateDashboard();toast(t('save'));};$('#addOperation').onclick=()=>{const raw=Number(calcValue||0);if(!Number.isFinite(raw)||raw<=0){toast(t('enterAmount'));return}const amount=(calcType==='income'?1:-1)*raw;finance.operations.push({id:uid(),amount,description:$('#opDescription').value.trim(),date:$('#opDate').value||todayKey()});write(KEYS.finance,finance);calcValue='0';updateCalc();$('#opDescription').value='';renderFinance();updateDashboard();toast(t('operationAdded'));};

let schedule=read(KEYS.schedule,{weekday:new Date().getDay(),month:new Date().getMonth(),day:new Date().getDate(),tasks:{}});if(!schedule||typeof schedule!=='object')schedule={weekday:new Date().getDay(),month:new Date().getMonth(),day:new Date().getDate(),tasks:{}};if(!schedule.tasks||typeof schedule.tasks!=='object')schedule.tasks={};
if(!Object.keys(schedule.tasks).length){for(let h=8;h<=20;h++)schedule.tasks[`${String(h).padStart(2,'0')}:00`]='';write(KEYS.schedule,schedule)}
function populateDateControls(){$('#schedWeekday').innerHTML=dayNames[lang].map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('');$('#schedMonth').innerHTML=monthNames[lang].map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('');$('#schedWeekday').value=String(schedule.weekday);$('#schedMonth').value=String(schedule.month)}
function normalizeTimeValue(v){return /^([01]\d|2[0-3]):[0-5]\d$/.test(v)?v:''}
function renderSchedule(){populateDateControls();$('#schedDay').value=schedule.day;const entries=Object.entries(schedule.tasks).sort((a,b)=>a[0].localeCompare(b[0]));let out='';if(!entries.length)out=`<div class="empty">${esc(t('noTasks'))}</div>`;entries.forEach(([key,val])=>{out+=`<div class="slot ${String(val).trim()?'filled':''}" data-row="${esc(key)}"><input class="slot-time" type="time" step="60" value="${esc(key)}" data-time-old="${esc(key)}"><input data-slot="${esc(key)}" value="${esc(val||'')}" placeholder="${esc(t('taskPh',{time:key}))}"><span class="slot-dot"></span><button class="btn icon danger slot-delete" type="button" data-remove-slot="${esc(key)}">×</button></div>`});$('#scheduleList').innerHTML=out;$('#scheduleList').querySelectorAll('[data-slot]').forEach(i=>i.addEventListener('input',()=>{schedule.tasks[i.dataset.slot]=i.value;write(KEYS.schedule,schedule);i.parentElement.classList.toggle('filled',!!i.value.trim());updateDashboard();}));$('#scheduleList').querySelectorAll('[data-time-old]').forEach(i=>i.addEventListener('change',()=>{const old=i.dataset.timeOld,next=normalizeTimeValue(i.value);if(!next){i.value=old;return}if(next!==old&&Object.prototype.hasOwnProperty.call(schedule.tasks,next)){toast(t('timeExists'));i.value=old;return}const val=schedule.tasks[old]||'';delete schedule.tasks[old];schedule.tasks[next]=val;write(KEYS.schedule,schedule);renderSchedule();updateDashboard();}));$('#scheduleList').querySelectorAll('[data-remove-slot]').forEach(b=>b.onclick=()=>{delete schedule.tasks[b.dataset.removeSlot];write(KEYS.schedule,schedule);renderSchedule();updateDashboard();});}
$('#addSlot').onclick=()=>{const v=normalizeTimeValue($('#newSlotTime').value);if(!v){toast(t('chooseTime'));return}if(Object.prototype.hasOwnProperty.call(schedule.tasks,v)){toast(t('timeExists'));return}schedule.tasks[v]='';write(KEYS.schedule,schedule);$('#newSlotTime').value='';renderSchedule();};
$('#saveScheduleDate').onclick=()=>{schedule.weekday=Number($('#schedWeekday').value);schedule.month=Number($('#schedMonth').value);schedule.day=clamp(Math.floor(Number($('#schedDay').value)||1),1,31);write(KEYS.schedule,schedule);renderSchedule();updateDashboard();toast(t('dateSaved'));};
$('#fillToday').onclick=()=>{const d=new Date();schedule.weekday=d.getDay();schedule.month=d.getMonth();schedule.day=d.getDate();write(KEYS.schedule,schedule);renderSchedule();updateDashboard();toast(t('deviceDate'));};
['change','input'].forEach(evt=>{['schedWeekday','schedMonth','schedDay'].forEach(id=>$('#'+id).addEventListener(evt,()=>{schedule.weekday=Number($('#schedWeekday').value);schedule.month=Number($('#schedMonth').value);schedule.day=clamp(Math.floor(Number($('#schedDay').value)||1),1,31);write(KEYS.schedule,schedule);updateDashboard();}))});

function focusToday(){const k=todayKey();return timerData.sessions.filter(s=>localDateKey(s.date)===k).reduce((a,s)=>a+Math.max(0,Number(s.ms)||0),0)+(timerRunning?effectiveMs():0)}
function updateDashboard(){const latest=notes.notes.slice().sort((a,b)=>b.updatedAt-a.updatedAt)[0];$('#dashNote').textContent=latest?.body||t('noNotes');$('#dashSteps').textContent=currentSteps().toLocaleString(lang==='ru'?'ru-RU':'en-US');const hs=habitStats();$('#dashHabit').textContent=hs.pct+'%';$('#dashHabitBar').style.width=hs.pct+'%';$('#dashHabitMeta').textContent=`${hs.done} / ${hs.marked} ${t('checks')}`;$('#dashFocus').textContent=formatMs(focusToday());const balance=Number(finance.start||0)+finance.operations.reduce((a,o)=>a+Number(o.amount||0),0);$('#dashBalance').textContent=money(balance);$('#dashDate').textContent=schedule.day?`${schedule.day} ${monthNames[lang][Number(schedule.month)]}`:'—';$('#dashDay').textContent=dayNames[lang][Number(schedule.weekday)]||''}
let activePage=read(KEYS.page,'dashboard');function go(page){activePage=page;write(KEYS.page,page);if(typeof closeSettings==='function')closeSettings();$$('.page').forEach(p=>p.classList.toggle('active',p.id===page));$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));window.scrollTo({top:0,behavior:'smooth'})}$$('.nav-btn').forEach(b=>b.onclick=()=>go(b.dataset.page));
function renderAll(){applyI18n();renderNotes();renderSteps();renderHabits();renderTimer();renderFinance();renderSchedule();updateDashboard();go(activePage)}
let deferredInstall=null;
const installBtn=$('#installApp');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(installBtn)installBtn.classList.add('show');});

if(installBtn){installBtn.onclick=async()=>{if(!deferredInstall){toast(location.protocol==='file:'?t('installHintFile'):t('installHintBrowser'));return}deferredInstall.prompt();try{await deferredInstall.userChoice}catch{}deferredInstall=null;installBtn.classList.remove('show');};}
try{
  if('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
    navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
  }
}catch{}
try{localStorage.setItem('dailytracker.storageVersion','7')}catch{}
window.addEventListener('pagehide',()=>{try{if(timerRunning)checkpointTimer();saveNotes();write(KEYS.steps,steps);write(KEYS.habits,habits);write(KEYS.timer,timerData);write(KEYS.finance,finance);write(KEYS.schedule,schedule);write(KEYS.settings,{theme,lang});write(KEYS.page,activePage);saveNoteDraft();}catch{}});
window.addEventListener('beforeunload',()=>{try{if(timerRunning)checkpointTimer();saveNoteDraft();}catch{}});
renderAll();if(timerRunning){clearInterval(timerInterval);clearInterval(timerPersistInterval);timerInterval=setInterval(()=>{const ms=effectiveMs();if(ms>=36000000){checkpointTimer();pauseTimer();toast(t('limit'));return}renderClock();updateDashboard();renderTimer()},250);timerPersistInterval=setInterval(()=>{if(timerRunning)checkpointTimer()},1000);}document.addEventListener('visibilitychange',()=>{if(document.hidden){if(timerRunning)checkpointTimer();}else{renderClock();updateDashboard();renderTimer();}});
})();
